name: Verificação local sem API

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Testar simulador e referência salva
        run: python3 scripts/check_local.py --strict
